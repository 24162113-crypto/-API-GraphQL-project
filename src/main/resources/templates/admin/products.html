<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quản lý sản phẩm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="mb-0">Quản lý sản phẩm</h3>
        <button id="btnAdd" class="btn btn-success">Thêm sản phẩm</button>
    </div>
    <div class="input-group mb-3">
        <input id="keyword" type="text" class="form-control" placeholder="Tìm theo tên sản phẩm">
        <button id="btnSearch" class="btn btn-primary">Tìm kiếm</button>
        <button id="btnReset" class="btn btn-outline-secondary">Làm mới</button>
    </div>
    <div id="alertBox"></div>
    <table class="table table-bordered table-hover align-middle">
        <thead class="table-light">
        <tr>
            <th>ID</th>
            <th>Tên</th>
            <th>Giá</th>
            <th>Danh mục</th>
            <th>Mô tả</th>
            <th style="width: 150px">Thao tác</th>
        </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>
    <div class="d-flex justify-content-between align-items-center">
        <span id="pageInfo"></span>
        <ul id="pager" class="pagination mb-0"></ul>
    </div>
</div>

<div class="modal fade" id="formModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalTitle">Thêm sản phẩm</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="fId">
                <div class="mb-3">
                    <label class="form-label">Tên sản phẩm</label>
                    <input id="fName" type="text" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label">Giá</label>
                    <input id="fPrice" type="number" min="0" step="1000" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label">Danh mục</label>
                    <select id="fCategory" class="form-select">
                        <option value="">Không có danh mục</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Mô tả</label>
                    <textarea id="fDescription" rows="3" class="form-control"></textarea>
                </div>
                <div id="modalError" class="text-danger"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                <button type="button" id="btnSave" class="btn btn-primary">Lưu</button>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/products.js"></script>
</body>
</html>
